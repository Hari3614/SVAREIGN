name: svareign
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.9+16


environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI and UX packages
  google_fonts: ^6.2.1
  pin_code_fields: ^8.0.1
  animated_splash_screen: ^1.3.0
  lottie: ^3.3.1

  # Firebase packages
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.6
  firebase_auth: ^5.5.2
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.6
  firebase_performance: ^0.10.1+10

  # State management
  provider: ^6.1.4

  # Location and maps
  geolocator: ^14.0.0
  geocoding: ^3.0.0

  # UI components
  carousel_slider: ^5.0.0
  pinput: ^3.0.1
  flutter_rating_bar: ^4.0.1
  calendar_date_picker2: ^2.0.0
  flutter_datetime_picker_plus: ^2.2.0
  flutter_spinner_time_picker: ^0.2.1

  # Utilities
  intl: ^0.20.2
  timeago: ^3.2.2
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  http: ^1.4.0
  audioplayers: ^6.4.0
  url_launcher: ^6.3.1
  razorpay_flutter: ^1.4.0
  fluttertoast: ^8.2.12
  share_plus: ^7.2.1
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  flutter_google_places_sdk: ^0.4.2+1

dependency_overrides:
  flutter_google_places_sdk_android: ^0.3.0
  flutter_google_places_sdk_platform_interface: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/sounds/mixkit-hard-pop-click-2364.wav